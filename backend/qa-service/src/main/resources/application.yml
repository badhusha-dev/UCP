server:
  port: ${SERVER_PORT:8094}

spring:
  application:
    name: qa-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:15432/qa_db}
    username: ${SPRING_DATASOURCE_USERNAME:ecommerce_admin}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    default-property-inclusion: non_null

qa:
  runner:
    workspace-root: ${QA_WORKSPACE_ROOT:}
    work-directory: ${QA_RUNNER_DIRECTORY:${java.io.tmpdir}/ucp-qa-runs}
    maven-executable: ${QA_MAVEN_EXECUTABLE:mvn}
    node-executable: ${QA_NODE_EXECUTABLE:node}
    timeout-seconds: ${QA_RUNNER_TIMEOUT_SECONDS:1800}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: never
