spring:
  application:
    name: product-service
  cloud:
    config:
      enabled: false
  datasource:
    url: jdbc:h2:mem:productdb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: create-drop
    show-sql: false
  flyway:
    enabled: false
  sql:
    init:
      mode: never

eureka:
  client:
    enabled: false
    register-with-eureka: false
    fetch-registry: false

services:
  order:
    url: http://localhost:9999

management:
  tracing:
    enabled: false
  zipkin:
    tracing:
      endpoint: ""

resilience4j:
  circuitbreaker:
    instances:
      productServiceCB:
        slidingWindowSize: 5
        minimumNumberOfCalls: 2
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
  retry:
    instances:
      productServiceRetry:
        maxAttempts: 2
        waitDuration: 100ms

jwt:
  secret: product-test-signing-key-only-for-tests-2026
  issuer: universal-commerce
  audience: commerce-api
