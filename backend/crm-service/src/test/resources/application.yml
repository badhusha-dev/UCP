spring:
  application:
    name: crm-service
  cloud:
    config:
      enabled: false
  datasource:
    url: jdbc:h2:mem:crmdb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: create-drop
    show-sql: false
  flyway:
    enabled: false

eureka:
  client:
    enabled: false
    register-with-eureka: false
    fetch-registry: false

management:
  tracing:
    enabled: false

jwt:
  secret: test-jwt-secret-key-for-crm-service-x
  issuer: universal-commerce
  audience: commerce-api
