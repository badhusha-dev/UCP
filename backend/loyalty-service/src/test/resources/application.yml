spring:
  application:
    name: loyalty-service
  datasource:
    url: jdbc:h2:mem:loyaltytest;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    database-platform: org.hibernate.dialect.H2Dialect
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: false
  kafka:
    bootstrap-servers: "localhost:29092"
    producer:
      # Best-effort events: without a broker each send would otherwise block 60s (default max.block.ms).
      properties:
        max.block.ms: 500
      retries: 0
  cloud:
    config:
      enabled: false

server:
  port: 0

eureka:
  client:
    enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health
