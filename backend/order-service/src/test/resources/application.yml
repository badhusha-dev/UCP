SERVICE_TO_SERVICE_TOKEN: test-service-token
spring:
  application:
    name: order-service
  cloud:
    config:
      enabled: false
  datasource:
    url: jdbc:h2:mem:orderdb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    open-in-view: false
    defer-datasource-initialization: true
    hibernate:
      ddl-auto: create-drop
    show-sql: false
  flyway:
    enabled: false
  sql:
    init:
      # Run the real V8 migration text after Hibernate creates the entity tables, so every test class has the control-tower tables.
      mode: always
      schema-locations: classpath:db/migration/V8__order_control_tower.sql,classpath:db/migration/V9__returns_and_refunds_management.sql,classpath:db/migration/V10__returns_rma_number_backfill.sql
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      bootstrap-servers: localhost:9092
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

eureka:
  client:
    enabled: false
    register-with-eureka: false
    fetch-registry: false

# Downstream services point at an unused port so tests never reach a real local service.
services:
  product:
    url: http://localhost:9998
  stock:
    url: http://localhost:9998
  cart:
    url: http://localhost:9998

management:
  tracing:
    enabled: false
  zipkin:
    tracing:
      endpoint: ""

resilience4j:
  circuitbreaker:
    instances:
      orderServiceCB:
        slidingWindowSize: 5
        minimumNumberOfCalls: 2
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
  retry:
    instances:
      orderServiceRetry:
        maxAttempts: 2
        waitDuration: 100ms

jwt:
  secret: order-test-signing-key-only-for-tests-2026
  issuer: universal-commerce
  audience: commerce-api

ucp:
  outbox:
    initialize-schema: true   # H2 schema comes from entities; create outbox_events explicitly
    publisher:
      enabled: false          # no broker in tests
