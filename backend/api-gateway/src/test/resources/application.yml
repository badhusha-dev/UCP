spring:
  application:
    name: api-gateway
  cloud:
    config:
      enabled: false
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowed-origins:
              - http://localhost:3013
            allowed-methods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowed-headers: '*'
      routes:
        - id: user-service-route
          uri: http://localhost:8081
          predicates:
            - Path=/api/users/**
        - id: platform-service-route
          uri: http://localhost:8081
          predicates:
            - Path=/api/platform/**
        - id: product-service-route
          uri: http://localhost:8082
          predicates:
            - Path=/api/products/**
        - id: order-service-route
          uri: http://localhost:8083
          predicates:
            - Path=/api/orders/**
        - id: notification-service-route
          uri: http://localhost:8084
          predicates:
            - Path=/api/notifications/**
        - id: qa-service-route
          uri: http://localhost:18094
          predicates:
            - Path=/api/admin/qa/**
        - id: delivery-service-route
          uri: http://localhost:18091
          predicates:
            - Path=/api/delivery/**
        - id: accounting-service-route
          uri: http://localhost:18088
          predicates:
            - Path=/api/accounting/**

eureka:
  client:
    enabled: false
    register-with-eureka: false
    fetch-registry: false

jwt:
  secret: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
  expiration: 86400000

management:
  tracing:
    enabled: false
  zipkin:
    tracing:
      endpoint: ""
