SERVICE_TO_SERVICE_TOKEN: test-service-token
spring:
  application:
    name: stock-service
  cloud:
    config:
      enabled: false
  datasource:
    url: jdbc:h2:mem:inventorydb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: create-drop
    show-sql: false
  flyway:
    enabled: false
  sql:
    init:
      mode: never
  kafka:
    bootstrap-servers: localhost:9092

eureka:
  client:
    enabled: false
    register-with-eureka: false
    fetch-registry: false

management:
  tracing:
    enabled: false
  zipkin:
    tracing:
      endpoint: ""

ucp:
  outbox:
    initialize-schema: true   # H2 schema comes from entities; create outbox_events explicitly
    publisher:
      enabled: false          # no broker in tests
