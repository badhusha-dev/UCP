# =============================================================================
# Universal Commerce Platform - Alertmanager Configuration
# Phase 18: Production Observability, Alerting & SLO Automation
# =============================================================================

global:
  resolve_timeout: 5m
  http_config:
    follow_redirects: true

templates: []

# ── Alert Routing Tree ────────────────────────────────────────────────────────
route:
  receiver: 'ecommerce-default-webhook'
  group_by: ['alertname', 'service', 'severity']
  group_wait: 10s
  group_interval: 30s
  repeat_interval: 1h

  routes:
    # ── P1 Critical Routing ───────────────────────────────────────────────────
    - match:
        severity: critical
      receiver: 'pagerduty-critical'
      continue: true

    - match:
        severity: critical
      receiver: 'slack-critical-alerts'

    # ── P2 Warning Routing ────────────────────────────────────────────────────
    - match:
        severity: warning
      receiver: 'slack-warning-alerts'

    # ── Tier-Specific Routing ─────────────────────────────────────────────────
    - match:
        tier: database
      receiver: 'dba-alerts'

    - match:
        tier: resilience
      receiver: 'resilience-alerts'

# ── Alert Inhibition Rules ────────────────────────────────────────────────────
inhibit_rules:
  # Inhibit secondary performance/latency alerts if the service is completely down
  - source_match:
      alertname: 'ServiceDown'
      severity: 'critical'
    target_match_re:
      alertname: 'HighHttp5xxRate|HighP99Latency|HighJvmHeapUsage|HighSystemCpuUsage'
    equal: ['service']

  # Inhibit half-open alerts if circuit breaker is already fully open
  - source_match:
      alertname: 'Resilience4jCircuitBreakerOpen'
    target_match:
      alertname: 'Resilience4jCircuitBreakerHalfOpen'
    equal: ['name', 'service']

# ── Notification Receivers ────────────────────────────────────────────────────
receivers:
  - name: 'ecommerce-default-webhook'
    webhook_configs:
      - url: 'http://api-gateway:8080/actuator/health'
        send_resolved: true
        http_config:
          bearer_token: 'ops-internal-token-2026'

  - name: 'slack-critical-alerts'
    slack_configs:
      - api_url: 'https://hooks.slack.com/services/REPLACE_ME/REPLACE_ME/REPLACE_ME'
        channel: '#ecommerce-critical-alerts'
        send_resolved: true
        title: '🔥 [{{ .Status | toUpper }}] {{ .CommonLabels.alertname }} ({{ .CommonLabels.severity }})'
        text: >-
          *Service:* `{{ .CommonLabels.service }}`
          *Summary:* {{ .CommonAnnotations.summary }}
          *Description:* {{ .CommonAnnotations.description }}
          *Runbook:* <{{ .CommonAnnotations.runbook_url }}|Open Runbook>

  - name: 'slack-warning-alerts'
    slack_configs:
      - api_url: 'https://hooks.slack.com/services/REPLACE_ME/REPLACE_ME/REPLACE_ME'
        channel: '#ecommerce-warnings'
        send_resolved: true
        title: '⚠️ [{{ .Status | toUpper }}] {{ .CommonLabels.alertname }}'
        text: >-
          *Service:* `{{ .CommonLabels.service }}`
          *Summary:* {{ .CommonAnnotations.summary }}
          *Description:* {{ .CommonAnnotations.description }}

  - name: 'pagerduty-critical'
    pagerduty_configs:
      - routing_key: 'pd-ecommerce-production-routing-key'
        severity: 'critical'
        send_resolved: true
        description: '{{ .CommonAnnotations.summary }}'
        client: 'Prometheus Alertmanager'
        client_url: 'http://localhost:9093'

  - name: 'dba-alerts'
    webhook_configs:
      - url: 'http://api-gateway:8080/actuator/health'
        send_resolved: true

  - name: 'resilience-alerts'
    webhook_configs:
      - url: 'http://api-gateway:8080/actuator/health'
        send_resolved: true
