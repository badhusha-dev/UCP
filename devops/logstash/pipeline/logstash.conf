input {
  tcp {
    port => 5000
    codec => json_lines
  }
}

filter {
  # Normalize timestamp if present
  if [timestamp] {
    date {
      match => [ "timestamp", "ISO8601" ]
      target => "@timestamp"
      remove_field => [ "timestamp" ]
    }
  }

  # Ensure traceId and spanId are accessible under standard naming
  if [traceId] {
    mutate {
      add_field => { "trace_id" => "%{traceId}" }
    }
  }
  if [spanId] {
    mutate {
      add_field => { "span_id" => "%{spanId}" }
    }
  }

  # Tag records without service name
  if ![service] {
    mutate {
      add_tag => [ "missing_service_name" ]
    }
  }
}

output {
  elasticsearch {
    hosts => ["elasticsearch:9200"]
    index => "ecommerce-logs-%{+YYYY.MM.dd}"
    action => "index"
  }

  stdout {
    codec => rubydebug
  }
}
