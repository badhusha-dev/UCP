apiVersion: v1
kind: Secret
metadata:
  name: {{ include "ecommerce-platform.fullname" . }}-secrets
  labels:
    {{- include "ecommerce-platform.labels" . | nindent 4 }}
type: Opaque
stringData:
  POSTGRES_USER: {{ .Values.secrets.postgresUser | quote }}
  POSTGRES_PASSWORD: {{ .Values.secrets.postgresPassword | quote }}
  JWT_SECRET: {{ .Values.secrets.jwtSecret | quote }}
