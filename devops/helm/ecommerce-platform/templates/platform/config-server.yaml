apiVersion: apps/v1
kind: Deployment
metadata:
  name: config-server
  labels:
    {{- include "ecommerce-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: config-management
spec:
  replicas: {{ .Values.platform.configServer.replicaCount }}
  selector:
    matchLabels:
      app: config-server
  template:
    metadata:
      labels:
        app: config-server
    spec:
      containers:
        - name: config-server
          image: "{{ .Values.global.imageRegistry }}/{{ .Values.platform.configServer.image }}"
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports:
            - containerPort: {{ .Values.platform.configServer.port }}
              name: config
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "native,kubernetes"
            - name: CONFIG_REPO_URI
              value: "file:///config-repo"
            - name: EUREKA_CLIENT_SERVICEURL_DEFAULTZONE
              value: {{ .Values.config.eurekaUrl | quote }}
          resources:
            {{- toYaml .Values.platform.configServer.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: {{ .Values.platform.configServer.port }}
            initialDelaySeconds: 40
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: {{ .Values.platform.configServer.port }}
            initialDelaySeconds: 25
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 2
---
apiVersion: v1
kind: Service
metadata:
  name: config-server
  labels:
    {{- include "ecommerce-platform.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.platform.configServer.port }}
      targetPort: {{ .Values.platform.configServer.port }}
      name: config
  selector:
    app: config-server
