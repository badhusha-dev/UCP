apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
  labels:
    {{- include "ecommerce-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: microservice
spec:
  replicas: {{ .Values.services.notificationService.replicaCount }}
  selector:
    matchLabels:
      app: notification-service
  template:
    metadata:
      labels:
        app: notification-service
    spec:
      containers:
        - name: notification-service
          image: "{{ .Values.global.imageRegistry }}/{{ .Values.services.notificationService.image }}"
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports:
            - containerPort: {{ .Values.services.notificationService.port }}
              name: http
          envFrom:
            - configMapRef:
                name: {{ include "ecommerce-platform.fullname" . }}-config
            - secretRef:
                name: {{ include "ecommerce-platform.fullname" . }}-secrets
          env:
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:postgresql://{{ .Values.config.postgresHost }}:{{ .Values.config.postgresPort }}/notification_db"
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ include "ecommerce-platform.fullname" . }}-secrets
                  key: POSTGRES_USER
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "ecommerce-platform.fullname" . }}-secrets
                  key: POSTGRES_PASSWORD
            - name: SPRING_KAFKA_BOOTSTRAP_SERVERS
              value: {{ .Values.config.kafkaBootstrapServers | quote }}
          resources:
            {{- toYaml .Values.services.notificationService.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: {{ .Values.services.notificationService.port }}
            initialDelaySeconds: 45
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: {{ .Values.services.notificationService.port }}
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 2
---
apiVersion: v1
kind: Service
metadata:
  name: notification-service
  labels:
    {{- include "ecommerce-platform.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.services.notificationService.port }}
      targetPort: {{ .Values.services.notificationService.port }}
      name: http
  selector:
    app: notification-service
