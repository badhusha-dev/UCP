apiVersion: chaos-mesh.org/v1alpha1
kind: PodChaos
metadata:
  name: pod-kill-order-service
  namespace: ecommerce
  labels:
    app.kubernetes.io/name: pod-kill-order-service
    app.kubernetes.io/part-of: ecommerce-platform
    app.kubernetes.io/component: chaos-engineering
spec:
  action: pod-kill
  mode: fixed
  value: "1"
  selector:
    namespaces:
      - ecommerce
    labelSelectors:
      app: order-service
  duration: "30s"
  scheduler:
    cron: "*/10 * * * *"
