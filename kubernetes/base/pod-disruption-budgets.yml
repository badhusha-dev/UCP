# ==============================================================================
# Pod Disruption Budgets (PDB) - Universal Commerce Platform
# Guarantees High Availability & Zero-Downtime during EKS Node Upgrades & Spot Drains
# ==============================================================================

apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: api-gateway-pdb
  namespace: ecommerce
  labels:
    app.kubernetes.io/name: api-gateway
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: api-gateway
---
