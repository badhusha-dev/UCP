# Template for kubernetes/base/02-secrets.yml, which kubernetes/kustomization.yml reads and .gitignore excludes.
#
#   cp kubernetes/base/02-secrets.example.yml kubernetes/base/02-secrets.yml
#
# Then replace every REPLACE_ME. Generate random values with `openssl rand -hex 32`.
# Never commit the filled-in copy.
apiVersion: v1
kind: Secret
metadata:
  name: ecommerce-secrets
  namespace: ecommerce
  labels:
    app.kubernetes.io/part-of: ecommerce-platform
type: Opaque
stringData:
  POSTGRES_USER: "ecommerce_admin"
  POSTGRES_PASSWORD: "REPLACE_ME"
  # HS256 signing key shared with every service that verifies tokens: at least 32 random bytes, hex-encoded.
  JWT_SECRET: "REPLACE_ME"
  # Shared secret for /internal endpoints. Services refuse to start without it.
  SERVICE_TO_SERVICE_TOKEN: "REPLACE_ME"
  DELIVERY_OTP_PEPPER: "REPLACE_ME"
  # Grafana admin password (kubernetes/monitoring/prometheus-grafana.yml).
  GRAFANA_ADMIN_PASSWORD: "REPLACE_ME"
  # Optional: only for the dev-mode Vault in kubernetes/security/vault.yml.
  # VAULT_ROOT_TOKEN: "REPLACE_ME"
