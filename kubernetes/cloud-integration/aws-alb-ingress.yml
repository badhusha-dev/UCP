# ==============================================================================
# AWS Application Load Balancer (ALB) Ingress - Universal Commerce Platform
# Edge Ingress routing traffic to API Gateway and Storefront MFEs
# ==============================================================================

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ecommerce-alb-ingress
  namespace: ecommerce
  labels:
    app.kubernetes.io/name: ecommerce-alb-ingress
    app.kubernetes.io/part-of: ecommerce-platform
    app.kubernetes.io/managed-by: terraform-gitops
  annotations:
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}, {"HTTPS": 443}]'
    alb.ingress.kubernetes.io/ssl-redirect: '443'
    alb.ingress.kubernetes.io/healthcheck-path: /actuator/health
    alb.ingress.kubernetes.io/healthcheck-interval-seconds: '15'
    alb.ingress.kubernetes.io/healthcheck-timeout-seconds: '5'
    alb.ingress.kubernetes.io/healthy-threshold-count: '2'
    alb.ingress.kubernetes.io/unhealthy-threshold-count: '3'
    alb.ingress.kubernetes.io/success-codes: '200'
    alb.ingress.kubernetes.io/load-balancer-attributes: idle_timeout.timeout_seconds=60,routing.http2.enabled=true
spec:
  rules:
    - host: ecommerce.universal-commerce.com
      http:
        paths:
          # API Gateway Routing
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: api-gateway
                port:
                  number: 8080
          # Microfrontends Routing (Shell App & Federation)
          - path: /
            pathType: Prefix
            backend:
              service:
                name: shell-app
                port:
                  number: 80
