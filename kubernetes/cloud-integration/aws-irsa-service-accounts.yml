# ==============================================================================
# AWS EKS IAM Roles for Service Accounts (IRSA) - Universal Commerce Platform
# Least-Privilege Fine-Grained Identity Management for Cloud Microservices
# ==============================================================================

apiVersion: v1
kind: ServiceAccount
metadata:
  name: ecommerce-app-sa
  namespace: ecommerce
  labels:
    app.kubernetes.io/name: ecommerce-app-sa
    app.kubernetes.io/part-of: ecommerce-platform
    app.kubernetes.io/managed-by: terraform-gitops
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::123456789012:role/prod-universal-commerce-app-irsa-role
    eks.amazonaws.com/sts-regional-endpoints: "true"
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: aws-load-balancer-controller
  namespace: kube-system
  labels:
    app.kubernetes.io/name: aws-load-balancer-controller
    app.kubernetes.io/component: controller
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::123456789012:role/prod-universal-commerce-alb-controller-role
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: external-dns
  namespace: kube-system
  labels:
    app.kubernetes.io/name: external-dns
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::123456789012:role/prod-universal-commerce-external-dns-role
