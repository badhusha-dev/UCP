# ==============================================================================
# AWS EBS CSI StorageClass - Universal Commerce Platform
# High-Performance GP3 Dynamic Provisioning with KMS Envelope Encryption
# ==============================================================================

apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: ebs-gp3-encrypted
  labels:
    app.kubernetes.io/part-of: ecommerce-platform
    app.kubernetes.io/managed-by: terraform-gitops
  annotations:
    storageclass.kubernetes.io/is-default-class: "true"
provisioner: ebs.csi.aws.com
volumeBindingMode: WaitForFirstConsumer
allowVolumeExpansion: true
reclaimPolicy: Retain
parameters:
  type: gp3
  iops: "3000"
  throughput: "125"
  encrypted: "true"
