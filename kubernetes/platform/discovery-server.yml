apiVersion: apps/v1
kind: Deployment
metadata:
  name: discovery-server
  namespace: ecommerce
  labels:
    app: discovery-server
    app.kubernetes.io/component: service-discovery
spec:
  replicas: 1
  selector:
    matchLabels:
      app: discovery-server
  template:
    metadata:
      labels:
        app: discovery-server
    spec:
      containers:
        - name: discovery-server
          image: ecommerce/discovery-server:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8761
              name: eureka
          envFrom:
            - configMapRef:
                name: ecommerce-config
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8761
            initialDelaySeconds: 40
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8761
            initialDelaySeconds: 25
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 2
---
apiVersion: v1
kind: Service
metadata:
  name: discovery-server
  namespace: ecommerce
  labels:
    app: discovery-server
spec:
  type: ClusterIP
  ports:
    - port: 8761
      targetPort: 8761
      name: eureka
  selector:
    app: discovery-server
