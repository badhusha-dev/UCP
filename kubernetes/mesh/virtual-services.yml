apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: ecommerce-ingress-vs
  namespace: ecommerce
  labels:
    app.kubernetes.io/part-of: ecommerce-platform
    app.kubernetes.io/component: service-mesh
spec:
  hosts:
    - "ecommerce.local"
    - "*.ecommerce.local"
  gateways:
    - ecommerce-gateway
    - mesh
  http:
    # 1. Microservices REST API via API Gateway
    - name: api-routes
      match:
        - uri:
            prefix: /api/
        - uri:
            prefix: /actuator/
        - uri:
            prefix: /v3/api-docs
        - uri:
            prefix: /swagger-ui
      route:
        - destination:
            host: api-gateway.ecommerce.svc.cluster.local
            port:
              number: 8080
      timeout: 10s
      retries:
        attempts: 3
        perTryTimeout: 2s
        retryOn: "5xx,connect-failure,refused-stream"

    # 2. Real-Time WebSockets
    - name: websocket-routes
      match:
        - uri:
            prefix: /ws/
      route:
        - destination:
            host: notification-service.ecommerce.svc.cluster.local
            port:
              number: 8084
      timeout: 3600s

    # 3. Microfrontend Shell Application
    - name: frontend-routes
      match:
        - uri:
            prefix: /
      route:
        - destination:
            host: shell-app.ecommerce.svc.cluster.local
            port:
              number: 80
      timeout: 5s
---
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: order-service-vs
  namespace: ecommerce
  labels:
    app: order-service
    app.kubernetes.io/part-of: ecommerce-platform
    app.kubernetes.io/component: microservice
spec:
  hosts:
    - order-service
    - order-service.ecommerce.svc.cluster.local
  http:
    - name: canary-traffic-shift
      route:
        - destination:
            host: order-service.ecommerce.svc.cluster.local
            subset: v1
            port:
              number: 8083
          weight: 90
        - destination:
            host: order-service.ecommerce.svc.cluster.local
            subset: v2
            port:
              number: 8083
          weight: 10
      timeout: 3s
      retries:
        attempts: 3
        perTryTimeout: 500ms
        retryOn: "5xx,connect-failure,refused-stream,reset"
---
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: product-service-vs
  namespace: ecommerce
  labels:
    app: product-service
    app.kubernetes.io/part-of: ecommerce-platform
    app.kubernetes.io/component: microservice
spec:
  hosts:
    - product-service
    - product-service.ecommerce.svc.cluster.local
  http:
    - name: product-routes
      route:
        - destination:
            host: product-service.ecommerce.svc.cluster.local
            subset: v1
            port:
              number: 8082
      timeout: 2s
      retries:
        attempts: 3
        perTryTimeout: 350ms
        retryOn: "5xx,connect-failure,refused-stream"
---
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: user-service-vs
  namespace: ecommerce
  labels:
    app: user-service
    app.kubernetes.io/part-of: ecommerce-platform
    app.kubernetes.io/component: microservice
spec:
  hosts:
    - user-service
    - user-service.ecommerce.svc.cluster.local
  http:
    - name: user-routes
      route:
        - destination:
            host: user-service.ecommerce.svc.cluster.local
            subset: v1
            port:
              number: 8081
      timeout: 2s
      retries:
        attempts: 2
        perTryTimeout: 500ms
        retryOn: "5xx,connect-failure"
