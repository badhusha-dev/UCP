apiVersion: flagger.app/v1beta1
kind: Canary
metadata:
  name: order-service
  namespace: ecommerce
  labels:
    app: order-service
    app.kubernetes.io/part-of: ecommerce-platform
    app.kubernetes.io/component: microservice
spec:
  provider: nginx
  # Deployment target to manage
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: order-service
  # HPA reference to coordinate pod autoscaling
  autoscalerRef:
    apiVersion: autoscaling/v2
    kind: HorizontalPodAutoscaler
    name: order-service-hpa
  # Ingress reference for NGINX canary traffic weighting
  ingressRef:
    apiVersion: networking.k8s.io/v1
    kind: Ingress
    name: ecommerce-ingress
  progressDeadlineSeconds: 180
  # Service specification generated by Flagger (order-service-primary / order-service-canary)
  service:
    port: 8083
    targetPort: 8083
    name: order-service
    trafficPolicy:
      tls:
        mode: DISABLE
  # Progressive Canary Analysis schedule and thresholds
  analysis:
    interval: 1m
    threshold: 5
    maxWeight: 50
    stepWeight: 10
    # Automated metrics analyzed at each step
    metrics:
      - name: "request-success-rate"
        templateRef:
          name: request-success-rate
          namespace: ecommerce
        thresholdRange:
          min: 99
        interval: 1m
      - name: "request-duration"
        templateRef:
          name: request-duration
          namespace: ecommerce
        thresholdRange:
          max: 500
        interval: 1m
      - name: "circuit-breaker-open-state"
        templateRef:
          name: circuit-breaker-open-state
          namespace: ecommerce
        thresholdRange:
          max: 0
        interval: 1m
    # Automated health validation & synthetic load testing hooks
    webhooks:
      - name: "pre-rollout-health-check"
        type: pre-rollout
        url: "http://flagger-loadtester.flagger-system/actuator-check"
        timeout: 10s
        metadata:
          type: bash
          cmd: "curl -s -f http://order-service-canary.ecommerce:8083/actuator/health/readiness"
      - name: "canary-synthetic-traffic"
        type: rollout
        url: "http://flagger-loadtester.flagger-system/"
        timeout: 5s
        metadata:
          type: cmd
          cmd: "hey -z 1m -q 10 -c 2 http://ecommerce.local/api/orders"
      - name: "post-rollout-audit"
        type: post-rollout
        url: "http://flagger-loadtester.flagger-system/audit"
    # Alert notifications for canary progress, degradation, or rollback
    alerts:
      - name: "slack-canary-alerts"
        severity: warn
        providerRef:
          name: flagger-slack-alerts
          namespace: ecommerce
      - name: "webhook-canary-alerts"
        severity: error
        providerRef:
          name: flagger-webhook-alerts
          namespace: ecommerce
