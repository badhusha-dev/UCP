# ==============================================================================
# ArgoCD Master "App-of-Apps" Orchestrator - Universal Commerce Platform
# Declarative, wave-sequenced cluster bootstrap and continuous reconciliation
# ==============================================================================

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ecommerce-root-app
  namespace: argocd
  labels:
    app.kubernetes.io/name: ecommerce-root-app
    app.kubernetes.io/part-of: ecommerce-platform
    app.kubernetes.io/managed-by: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: ecommerce-platform
  source:
    repoURL: "https://github.com/ecommerce-platform/gitops-repo.git"
    targetRevision: HEAD
    path: kubernetes/gitops/argocd/apps
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
---
# ── Wave 0: Cloud Infrastructure & Storage ────────────────────────────────────
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ecommerce-cloud-infrastructure
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  labels:
    app.kubernetes.io/part-of: ecommerce-platform
spec:
  project: ecommerce-platform
  source:
    repoURL: "https://github.com/ecommerce-platform/gitops-repo.git"
    targetRevision: HEAD
    path: kubernetes/cloud-integration
  destination:
    server: https://kubernetes.default.svc
    namespace: ecommerce
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
---
# ── Wave 1: Security, Vault & Resilience Policies ─────────────────────────────
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ecommerce-security-policies
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  labels:
    app.kubernetes.io/part-of: ecommerce-platform
spec:
  project: ecommerce-platform
  source:
    repoURL: "https://github.com/ecommerce-platform/gitops-repo.git"
    targetRevision: HEAD
    path: kubernetes/security
  destination:
    server: https://kubernetes.default.svc
    namespace: ecommerce
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
---
# ── Wave 2: Core Platform Services (Config & Discovery) ───────────────────────
apiVersion: argoproj.io/v1alpha1
