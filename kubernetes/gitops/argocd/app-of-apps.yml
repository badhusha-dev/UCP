    argocd.argoproj.io/sync-wave: "2"
  labels:
    app.kubernetes.io/part-of: ecommerce-platform
spec:
  project: ecommerce-platform
  source:
    repoURL: "https://github.com/ecommerce-platform/gitops-repo.git"
    targetRevision: HEAD
    path: kubernetes/platform
  destination:
    server: https://kubernetes.default.svc
    namespace: ecommerce
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
---
# ── Wave 3: Domain Microservices (User, Product, Order, Notification) ─────────
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ecommerce-domain-services
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"
  labels:
    app.kubernetes.io/part-of: ecommerce-platform
spec:
  project: ecommerce-platform
  source:
    repoURL: "https://github.com/ecommerce-platform/gitops-repo.git"
    targetRevision: HEAD
    path: kubernetes/services
  destination:
    server: https://kubernetes.default.svc
    namespace: ecommerce
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    ignoreDifferences:
      - group: apps
        kind: Deployment
        jsonPointers:
          - /spec/replicas
---
