apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ecommerce-platform-prod
  namespace: argocd
  labels:
    app.kubernetes.io/name: ecommerce-platform
    app.kubernetes.io/part-of: ecommerce-platform
    environment: production
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: ecommerce-platform

  source:
    repoURL: "https://github.com/ecommerce-platform/gitops-repo.git"
    targetRevision: HEAD
    path: kubernetes

  destination:
    server: https://kubernetes.default.svc
    namespace: ecommerce

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
      - PruneLast=true
      - RespectIgnoreDifferences=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m

  # Prevent ArgoCD from fighting Flagger or HPA replica scaling
  ignoreDifferences:
    - group: apps
      kind: Deployment
      jsonPointers:
        - /spec/replicas
    - group: autoscaling
      kind: HorizontalPodAutoscaler
      jsonPointers:
        - /status
