apiVersion: v1
kind: ConfigMap
metadata:
  name: alertmanager-config
  namespace: ecommerce
data:
  alertmanager.yml: |
    global:
      resolve_timeout: 5m
      http_config:
        follow_redirects: true
    route:
      receiver: 'ecommerce-default-webhook'
      group_by: ['alertname', 'service', 'severity']
      group_wait: 10s
      group_interval: 30s
      repeat_interval: 1h
      routes:
        - match:
            severity: critical
          receiver: 'pagerduty-critical'
          continue: true
        - match:
            severity: critical
          receiver: 'slack-critical-alerts'
        - match:
            severity: warning
          receiver: 'slack-warning-alerts'
        - match:
            tier: database
          receiver: 'dba-alerts'
        - match:
            tier: resilience
          receiver: 'resilience-alerts'
    inhibit_rules:
      - source_match:
          alertname: 'ServiceDown'
          severity: 'critical'
        target_match_re:
          alertname: 'HighHttp5xxRate|HighP99Latency|HighJvmHeapUsage|HighSystemCpuUsage'
        equal: ['service']
      - source_match:
          alertname: 'Resilience4jCircuitBreakerOpen'
        target_match:
          alertname: 'Resilience4jCircuitBreakerHalfOpen'
        equal: ['name', 'service']
    receivers:
      - name: 'ecommerce-default-webhook'
        webhook_configs:
          - url: 'http://api-gateway:8080/actuator/health'
            send_resolved: true
      - name: 'slack-critical-alerts'
        slack_configs:
          - api_url: 'https://hooks.slack.com/services/REPLACE_ME/REPLACE_ME/REPLACE_ME'
            channel: '#ecommerce-critical-alerts'
            send_resolved: true
      - name: 'slack-warning-alerts'
        slack_configs:
          - api_url: 'https://hooks.slack.com/services/REPLACE_ME/REPLACE_ME/REPLACE_ME'
            channel: '#ecommerce-warnings'
            send_resolved: true
      - name: 'pagerduty-critical'
        pagerduty_configs:
          - routing_key: 'pd-ecommerce-production-routing-key'
            severity: 'critical'
            send_resolved: true
            description: '{{ .CommonAnnotations.summary }}'
      - name: 'dba-alerts'
        webhook_configs:
          - url: 'http://api-gateway:8080/actuator/health'
            send_resolved: true
      - name: 'resilience-alerts'
        webhook_configs:
          - url: 'http://api-gateway:8080/actuator/health'
            send_resolved: true
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-rules
  namespace: ecommerce
data:
  ecommerce-alerts.yml: |
    groups:
      - name: ecommerce.slo.rules
        interval: 15s
        rules:
          - alert: ServiceDown
            expr: up{service=~"api-gateway|user-service|product-service|order-service|notification-service"} == 0
            for: 1m
            labels:
              severity: critical
              tier: platform
              team: sre-core
            annotations:
              summary: "Microservice {{ $labels.service }} is DOWN"
              description: "Instance {{ $labels.instance }} of service {{ $labels.service }} has been unreachable for > 1m."
              runbook_url: "https://ops.ecommerce.internal/runbooks/service-down"

          - alert: HighHttp5xxRate
            expr: (sum(rate(http_server_requests_seconds_count{status=~"5.."}[2m])) by (service) / sum(rate(http_server_requests_seconds_count[2m])) by (service)) * 100 > 2.0
            for: 2m
            labels:
              severity: critical
              tier: api
              team: backend-ops
            annotations:
              summary: "High HTTP 5xx error rate on {{ $labels.service }}"
              description: "Service {{ $labels.service }} is failing with {{ $value | printf \"%.2f\" }}% 5xx server errors over the last 2 minutes."
              runbook_url: "https://ops.ecommerce.internal/runbooks/high-error-rate"

          - alert: HighP99Latency
            expr: histogram_quantile(0.99, sum(rate(http_server_requests_seconds_bucket[3m])) by (le, service)) > 0.500
            for: 3m
            labels:
              severity: warning
              tier: api
              team: backend-ops
            annotations:
              summary: "High P99 API Latency on {{ $labels.service }}"
              description: "P99 latency for {{ $labels.service }} exceeds 500ms (current: {{ $value | printf \"%.3f\" }}s)."
              runbook_url: "https://ops.ecommerce.internal/runbooks/high-latency"

          - alert: Resilience4jCircuitBreakerOpen
            expr: resilience4j_circuitbreaker_state{state="open"} > 0
            for: 1m
            labels:
              severity: critical
              tier: resilience
              team: platform-reliability
            annotations:
              summary: "Circuit Breaker {{ $labels.name }} is OPEN"
              description: "Resilience4j circuit breaker {{ $labels.name }} in {{ $labels.service }} entered OPEN state."
              runbook_url: "https://ops.ecommerce.internal/runbooks/circuit-breaker-open"

          - alert: Resilience4jCircuitBreakerHalfOpen
            expr: resilience4j_circuitbreaker_state{state="half_open"} > 0
            for: 2m
            labels:
              severity: warning
              tier: resilience
              team: platform-reliability
            annotations:
              summary: "Circuit Breaker {{ $labels.name }} is HALF-OPEN"
              description: "Resilience4j circuit breaker {{ $labels.name }} in {{ $labels.service }} is testing downstream recovery."
              runbook_url: "https://ops.ecommerce.internal/runbooks/circuit-breaker-half-open"

          - alert: HighJvmHeapUsage
            expr: (jvm_memory_used_bytes{area="heap"} / jvm_memory_max_bytes{area="heap"}) * 100 > 85.0
            for: 2m
            labels:
              severity: warning
              tier: jvm
              team: backend-ops
            annotations:
              summary: "High JVM Heap utilization on {{ $labels.service }}"
              description: "JVM Heap usage on {{ $labels.service }} is {{ $value | printf \"%.1f\" }}% (> 85%)."
              runbook_url: "https://ops.ecommerce.internal/runbooks/jvm-heap"

          - alert: HighSystemCpuUsage
            expr: system_cpu_usage * 100 > 85.0
            for: 3m
            labels:
              severity: warning
              tier: system
              team: sre-core
            annotations:
              summary: "High CPU utilization on {{ $labels.service }}"
              description: "System CPU utilization on {{ $labels.service }} is {{ $value | printf \"%.1f\" }}% (> 85%)."
              runbook_url: "https://ops.ecommerce.internal/runbooks/high-cpu"

          - alert: HikariPoolSaturation
            expr: (hikaricp_connections_active / hikaricp_connections_max) * 100 > 90.0
            for: 2m
            labels:
              severity: critical
              tier: database
              team: dba-sre
            annotations:
              summary: "HikariCP pool near saturation for {{ $labels.service }}"
              description: "Active connections on {{ $labels.service }} pool {{ $labels.pool }} reached {{ $value | printf \"%.1f\" }}%."
              runbook_url: "https://ops.ecommerce.internal/runbooks/db-pool-saturation"

          - alert: SyntheticProbeFailure
            expr: probe_success == 0
            for: 1m
            labels:
              severity: critical
              tier: synthetic
              team: sre-core
            annotations:
              summary: "Synthetic Health Probe Failure for {{ $labels.instance }}"
              description: "Synthetic endpoint probe failed for target {{ $labels.instance }}."
              runbook_url: "https://ops.ecommerce.internal/runbooks/synthetic-probe-failure"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alertmanager
  namespace: ecommerce
  labels:
    app: alertmanager
    tier: monitoring
spec:
  replicas: 1
  selector:
    matchLabels:
      app: alertmanager
  template:
    metadata:
      labels:
        app: alertmanager
        tier: monitoring
    spec:
      containers:
        - name: alertmanager
          image: prom/alertmanager:v0.27.0
          args:
            - "--config.file=/etc/alertmanager/alertmanager.yml"
            - "--storage.path=/alertmanager"
            - "--web.external-url=http://localhost:9093"
          ports:
            - containerPort: 9093
              name: http
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: 9093
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /-/ready
              port: 9093
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          volumeMounts:
            - name: config-volume
              mountPath: /etc/alertmanager
      volumes:
        - name: config-volume
          configMap:
            name: alertmanager-config
---
apiVersion: v1
kind: Service
metadata:
  name: alertmanager
  namespace: ecommerce
  labels:
    app: alertmanager
spec:
  type: ClusterIP
  ports:
    - port: 9093
      targetPort: 9093
      name: http
  selector:
    app: alertmanager
