# Ingress paths for the ten services added to the cluster in v2.0.0 and for the callers that reach them.
# Each rule matches a URL in backend/config-repo (docker profile). Ports are the callee's listener.
# Pods are default-deny for ingress (network-policies.yml), so every caller/callee pair must be listed here.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-gateway-to-additional-services
  namespace: ecommerce
  labels:
    app.kubernetes.io/name: allow-gateway-to-additional-services
    app.kubernetes.io/part-of: ecommerce-platform
    app.kubernetes.io/component: security
spec:
  podSelector:
    matchExpressions:
      - key: app
        operator: In
        values:
          - accounting-service
          - analytics-service
          - cart-service
          - crm-service
          - error-stack-service
          - inventory-service
          - loyalty-service
          - procurement-service
          - qa-service
          - stock-service
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: api-gateway
      ports:
        - protocol: TCP
          port: 8085
        - protocol: TCP
          port: 8086
        - protocol: TCP
          port: 8087
        - protocol: TCP
          port: 8088
        - protocol: TCP
          port: 8089
        - protocol: TCP
          port: 8090
        - protocol: TCP
          port: 8091
        - protocol: TCP
          port: 8092
        - protocol: TCP
          port: 8093
        - protocol: TCP
          port: 8094
---
