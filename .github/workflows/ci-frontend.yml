name: Frontend Microfrontends CI/CD

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'frontend/**'
      - '.github/workflows/ci-frontend.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'frontend/**'
      - '.github/workflows/ci-frontend.yml'

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}/ecommerce

jobs:
  # ──────────────────────────────────────────────────────────────────────────
  # 1. MATRIX BUILD & LINT ACROSS ALL MFEs
  # ──────────────────────────────────────────────────────────────────────────
  unit-tests:
    name: Frontend unit tests (${{ matrix.workspace }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        workspace:
          - "@ecommerce/shared-library"
          - mfe-order
          - mfe-product
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      # The model tests run TypeScript directly via --experimental-strip-types (Node 22.6+).
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        working-directory: frontend
        run: npm ci

      - name: Run node --test suites
        working-directory: frontend
        run: npm test --workspace=${{ matrix.workspace }}

  build-frontend:
    name: Build MFE (${{ matrix.app }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app:
          - shell-app
          - mfe-product
          - mfe-order
          - mfe-user
          - mfe-inventory
          - mfe-super-admin
          - mfe-delivery
          - mfe-stock
          - mfe-cart
          - mfe-loyalty
          - mfe-accounting
          - mfe-analytics
          - mfe-error-stack
          - mfe-crm
          - mfe-procurement
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/${{ matrix.app }}/package.json

      - name: Install Dependencies
        working-directory: frontend
        run: npm ci

      - name: Build shared contracts and identity utilities
        working-directory: frontend
        run: npm run build --workspace=@ecommerce/shared-library

      - name: Build Application & Module Federation Remotes
        working-directory: frontend
        run: npm run build --workspace=${{ matrix.app }}

      - name: Verify Build Artifacts
        working-directory: frontend
        run: |
          if [ -d "${{ matrix.app }}/dist" ]; then
            echo "Build directory dist/ exists."
          else
            echo "Build failed: dist/ not found!" && exit 1
          fi

  # ──────────────────────────────────────────────────────────────────────────
  # 2. DOCKER BUILD & PUBLISH FRONTEND CONTAINERS
  # ──────────────────────────────────────────────────────────────────────────
  docker-frontend:
    name: Docker Build & Push (${{ matrix.mfe.name }})
    runs-on: ubuntu-latest
    needs: build-frontend
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        mfe:
          - name: shell-app
          - name: mfe-product
          - name: mfe-order
          - name: mfe-user
          - name: mfe-inventory
          - name: mfe-super-admin
          - name: mfe-delivery
            nginx_conf: nginx-delivery.conf
          - name: mfe-stock
          - name: mfe-cart
          - name: mfe-loyalty
          - name: mfe-accounting
          - name: mfe-analytics
          - name: mfe-error-stack
          - name: mfe-crm
          - name: mfe-procurement
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Frontend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile.mfe
          build-args: |
            APP=${{ matrix.mfe.name }}
            NGINX_CONF=${{ matrix.mfe.nginx_conf || 'nginx.conf' }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-${{ matrix.mfe.name }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-${{ matrix.mfe.name }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
