name: Backend Microservices CI/CD & Quality Gate

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'backend/**'
      - '.github/workflows/ci-backend.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'backend/**'
      - '.github/workflows/ci-backend.yml'

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}/ecommerce

jobs:
  # ──────────────────────────────────────────────────────────────────────────
  # 1. MATRIX BUILD & TEST ACROSS ALL MICROSERVICES
  # ──────────────────────────────────────────────────────────────────────────
  build-and-test:
    name: Build & Test (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - discovery-server
          - config-server
          - user-service
          - product-service
          - order-service
          - notification-service
          - api-gateway
          - inventory-service
          - delivery-service
          - accounting-service
          - analytics-service
          - cart-service
          - crm-service
          - error-stack-service
          - loyalty-service
          - procurement-service
          - qa-service
          - stock-service
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up JDK 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Compile & Run Unit Tests
        working-directory: backend
        run: |
          chmod +x mvnw
          ./mvnw clean test -pl ${{ matrix.service }} -am

      - name: Package Service JAR
        working-directory: backend
        run: ./mvnw package -DskipTests -pl ${{ matrix.service }} -am

      - name: Upload Test Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ matrix.service }}
          path: backend/${{ matrix.service }}/target/surefire-reports/*.xml
          if-no-files-found: ignore

      - name: Upload Packaged Artifact
        uses: actions/upload-artifact@v4
        with:
          name: jar-${{ matrix.service }}
          path: backend/${{ matrix.service }}/target/*.jar

  # ──────────────────────────────────────────────────────────────────────────
  # 2. SONARQUBE CODE QUALITY GATE SCAN
  # ──────────────────────────────────────────────────────────────────────────
  sonarqube-analysis:
    name: SonarQube Quality Gate
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Run SonarQube Scanner
        uses: SonarSource/sonarqube-scan-action@v4
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        with:
          projectBaseDir: backend

      - name: Verify Quality Gate Status
        uses: SonarSource/sonarqube-quality-gate-action@v1.1.0
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  # ──────────────────────────────────────────────────────────────────────────
  # 3. OWASP DEPENDENCY-CHECK SECURITY AUDIT
  # ──────────────────────────────────────────────────────────────────────────
  owasp-dependency-scan:
    name: OWASP Vulnerability Scan
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Run OWASP Dependency-Check Scan
        working-directory: backend
        run: |
          chmod +x mvnw
          ./mvnw org.owasp:dependency-check-maven:check -DautoUpdate=false -DfailOnError=false

      - name: Upload OWASP Vulnerability Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: owasp-vulnerability-reports
          path: backend/**/target/dependency-check-report.*
          if-no-files-found: ignore

  # ──────────────────────────────────────────────────────────────────────────
  # 4. CONTAINER BUILD & REGISTRY PUBLISH
  # ──────────────────────────────────────────────────────────────────────────
  docker-publish:
    name: Docker Build & Push (${{ matrix.service.name }})
    runs-on: ubuntu-latest
    needs: [build-and-test, sonarqube-analysis, owasp-dependency-scan]
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service:
          - name: discovery-server
            dockerfile: Dockerfile.discovery
          - name: config-server
            dockerfile: Dockerfile.config
          - name: user-service
            dockerfile: Dockerfile.user
          - name: product-service
            dockerfile: Dockerfile.product
          - name: order-service
            dockerfile: Dockerfile.order
          - name: notification-service
            dockerfile: Dockerfile.notification
          - name: api-gateway
            dockerfile: Dockerfile.gateway
          - name: inventory-service
            dockerfile: Dockerfile.inventory
          - name: delivery-service
            dockerfile: Dockerfile.delivery
          - name: accounting-service
            dockerfile: Dockerfile.accounting
          - name: analytics-service
            dockerfile: Dockerfile.analytics
          - name: cart-service
            dockerfile: Dockerfile.cart
          - name: crm-service
            dockerfile: Dockerfile.crm
          - name: error-stack-service
            dockerfile: Dockerfile.error-stack
          - name: loyalty-service
            dockerfile: Dockerfile.loyalty
          - name: procurement-service
            dockerfile: Dockerfile.procurement
          - name: qa-service
            dockerfile: Dockerfile.qa
          - name: stock-service
            dockerfile: Dockerfile.stock
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/${{ matrix.service.dockerfile }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-${{ matrix.service.name }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-${{ matrix.service.name }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
