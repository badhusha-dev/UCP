      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET must be set in .env}
      - ZIPKIN_BASE_URL=http://zipkin:9411
      - LOGSTASH_HOST=logstash
      - RETURNS_ATTACHMENTS_DIR=/data/return-evidence
      - LOGSTASH_PORT=5000
    volumes:
