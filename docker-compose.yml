      - ORDER_SERVICE_URL=http://order-service:8083
      - DELIVERY_OTP_PEPPER=${DELIVERY_OTP_PEPPER:?DELIVERY_OTP_PEPPER must be set in .env}
      - JWT_SECRET=${JWT_SECRET}
      - POSTGRES_USER=${POSTGRES_USER:-ecommerce_admin}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-admin_password}
      - DELIVERY_DB_URL=jdbc:postgresql://postgres:5432/delivery_db
      - IDENTITY_SERVICE_URL=http://user-service:8081
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://discovery-server:8761/eureka/
      - CONFIG_SERVER_URL=http://config-server:8888
      - SPRING_PROFILES_ACTIVE=docker
