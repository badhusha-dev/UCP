      - ZIPKIN_BASE_URL=http://zipkin:9411
      - LOGSTASH_HOST=logstash
      - LOGSTASH_PORT=5000
      - IDENTITY_SERVICE_URL=http://user-service:8081
      - STOREFRONT_MEDIA_DIR=/data/storefront-media
      - SPRING_SERVLET_MULTIPART_MAX_FILE_SIZE=6MB
      - SPRING_SERVLET_MULTIPART_MAX_REQUEST_SIZE=7MB
    volumes:
      - ./backend/product-service/target/product-service-1.0.0-SNAPSHOT.jar:/app/app.jar:ro
      - storefront_media_data:/data/storefront-media
    depends_on:
